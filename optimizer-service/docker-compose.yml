# Coolify: create a "Docker Compose" resource pointing at this directory (base directory
# /optimizer-service) and give the `optimizer` service its domain, e.g. https://pakkaus.example.com.
# SERVICE_* variables are generated by Coolify; ${NAME:?} ones must be filled in before deploying.
services:
  optimizer:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_OPTIMIZER_8000
      - PUBLIC_URL=${SERVICE_URL_OPTIMIZER}
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?}
      - GITHUB_ORG=${GITHUB_ORG:-JCO-Digital}
      - ADMIN_USERS=${ADMIN_USERS:-}
      # Optional shared token for sites not yet moved to dashboard keys.
      - API_TOKEN=${OPTIMIZER_API_TOKEN:-}
      - WORKERS=${WORKERS:-1}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-0}
      - MAX_INPUT_MB=${MAX_INPUT_MB:-4096}
      - MAX_REQUEST_KB=${MAX_REQUEST_KB:-64}
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-14400}
      - JOB_TTL_HOURS=${JOB_TTL_HOURS:-24}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - optimizer-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  optimizer-data:
